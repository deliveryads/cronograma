<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronograma de Responsabilidades</title>
<style>
  :root {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --surface-alt: #eceff4;
    --border: #dde1e9;
    --text: #1a1d24;
    --text-muted: #5b6270;
    --text-faint: #8a90a0;
    --accent: #3454d1;
    --accent-soft: #e8ecfd;
    --accent-contrast: #ffffff;
    --focus: #3454d1;
    --today-ring: #3454d1;

    --type-ferias: #b45309;
    --type-ferias-bg: #fdf1e0;
    --type-curso: #0f7a5f;
    --type-curso-bg: #e2f5ef;
    --type-reuniao: #6d28d9;
    --type-reuniao-bg: #efe7fd;
    --type-importante: #b91c1c;
    --type-importante-bg: #fbe4e2;
    --type-ponto: #1d4ed8;
    --type-ponto-bg: #e3ecfd;

    --shadow: 0 1px 2px rgba(20, 24, 34, 0.04), 0 8px 24px -12px rgba(20, 24, 34, 0.12);
    --radius-sm: 6px;
    --radius-md: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a;
      --surface: #1a1d25;
      --surface-alt: #21252f;
      --border: #2c313d;
      --text: #e8eaf0;
      --text-muted: #9aa0b0;
      --text-faint: #6b7182;
      --accent: #8199ff;
      --accent-soft: #262c47;
      --accent-contrast: #0d0e13;
      --focus: #8199ff;
      --today-ring: #8199ff;

      --type-ferias: #f0b458;
      --type-ferias-bg: #3a2c15;
      --type-curso: #5fd3ac;
      --type-curso-bg: #123028;
      --type-reuniao: #b79bfa;
      --type-reuniao-bg: #2a2145;
      --type-importante: #f2857e;
      --type-importante-bg: #3a1c1c;
      --type-ponto: #8fabff;
      --type-ponto-bg: #1c2540;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }

  :root[data-theme="dark"] {
    --bg: #12141a;
    --surface: #1a1d25;
    --surface-alt: #21252f;
    --border: #2c313d;
    --text: #e8eaf0;
    --text-muted: #9aa0b0;
    --text-faint: #6b7182;
    --accent: #8199ff;
    --accent-soft: #262c47;
    --accent-contrast: #0d0e13;
    --focus: #8199ff;
    --today-ring: #8199ff;

    --type-ferias: #f0b458;
    --type-ferias-bg: #3a2c15;
    --type-curso: #5fd3ac;
    --type-curso-bg: #123028;
    --type-reuniao: #b79bfa;
    --type-reuniao-bg: #2a2145;
    --type-importante: #f2857e;
    --type-importante-bg: #3a1c1c;
    --type-ponto: #8fabff;
    --type-ponto-bg: #1c2540;

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  }

  :root[data-theme="light"] {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --surface-alt: #eceff4;
    --border: #dde1e9;
    --text: #1a1d24;
    --text-muted: #5b6270;
    --text-faint: #8a90a0;
    --accent: #3454d1;
    --accent-soft: #e8ecfd;
    --accent-contrast: #ffffff;
    --focus: #3454d1;
    --today-ring: #3454d1;

    --type-ferias: #b45309;
    --type-ferias-bg: #fdf1e0;
    --type-curso: #0f7a5f;
    --type-curso-bg: #e2f5ef;
    --type-reuniao: #6d28d9;
    --type-reuniao-bg: #efe7fd;
    --type-importante: #b91c1c;
    --type-importante-bg: #fbe4e2;
    --type-ponto: #1d4ed8;
    --type-ponto-bg: #e3ecfd;

    --shadow: 0 1px 2px rgba(20, 24, 34, 0.04), 0 8px 24px -12px rgba(20, 24, 34, 0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    max-width: 100%;
    overflow-x: hidden;
  }

  body { min-height: 100vh; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  a { color: inherit; }

  button, select, input {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
  }

  button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .app {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 24px;
    margin-bottom: 22px;
  }

  .header h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    text-wrap: balance;
  }

  .header .subtitle {
    margin: 4px 0 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  .header .source-note {
    font-size: 12px;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .source-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--type-curso);
    flex: none;
  }
  .source-dot.fallback { background: var(--type-ferias); }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ---------- Filter rail ---------- */
  .filters {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    position: sticky;
    top: 20px;
  }

  @media (max-width: 860px) {
    .filters { position: static; }
  }

  .filter-group { display: flex; flex-direction: column; gap: 6px; }

  .filter-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
  }

  .filters input[type="search"],
  .filters select {
    width: 100%;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
  }

  .type-chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    color: var(--text-muted);
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }

  .chip .swatch {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
  }

  .chip[aria-pressed="true"] {
    color: var(--text);
    border-color: currentColor;
  }
  .chip[data-type="ferias"][aria-pressed="true"] { background: var(--type-ferias-bg); color: var(--type-ferias); border-color: var(--type-ferias); }
  .chip[data-type="curso"][aria-pressed="true"] { background: var(--type-curso-bg); color: var(--type-curso); border-color: var(--type-curso); }
  .chip[data-type="reuniao"][aria-pressed="true"] { background: var(--type-reuniao-bg); color: var(--type-reuniao); border-color: var(--type-reuniao); }
  .chip[data-type="data_importante"][aria-pressed="true"] { background: var(--type-importante-bg); color: var(--type-importante); border-color: var(--type-importante); }
  .chip[data-type="ponto"][aria-pressed="true"] { background: var(--type-ponto-bg); color: var(--type-ponto); border-color: var(--type-ponto); }

  .clear-btn {
    align-self: flex-start;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    padding: 2px 0;
  }

  .filter-summary {
    font-size: 12.5px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .filter-summary strong { color: var(--text); font-variant-numeric: tabular-nums; }

  /* ---------- Main ---------- */
  .main { min-width: 0; }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 14px;
  }

  .month-nav { display: flex; align-items: center; gap: 8px; }

  .nav-btn {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
  }
  .nav-btn:hover { background: var(--surface-alt); }

  .month-label {
    font-size: 17px;
    font-weight: 700;
    min-width: 168px;
    text-align: center;
    text-transform: capitalize;
  }

  .today-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 7px 12px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .today-btn:hover { background: var(--surface-alt); }

  .view-toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .view-toggle button {
    border: none;
    background: var(--surface);
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    color: var(--text-muted);
  }
  .view-toggle button + button { border-left: 1px solid var(--border); }
  .view-toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-contrast); }

  /* ---------- Calendar grid ---------- */
  .calendar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .weekday-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--border);
    background: var(--surface-alt);
  }
  .weekday-row div {
    padding: 9px 6px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    text-align: center;
  }

  .weeks { display: flex; flex-direction: column; }
  .week-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .week-row:last-child { border-bottom: none; }

  .day-cell {
    min-height: 96px;
    border-right: 1px solid var(--border);
    padding: 6px 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    background: var(--surface);
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .day-cell:last-child { border-right: none; }
  .day-cell:hover { background: var(--surface-alt); }
  .day-cell.outside { color: var(--text-faint); background: var(--surface-alt); }
  .day-cell.outside .day-num { color: var(--text-faint); }

  .day-num {
    font-size: 12.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  .day-cell.is-today .day-num {
    background: var(--today-ring);
    color: var(--accent-contrast);
  }

  .day-events { display: flex; flex-direction: column; gap: 3px; }

  .event-pill {
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .event-pill[data-type="ferias"] { background: var(--type-ferias-bg); color: var(--type-ferias); }
  .event-pill[data-type="curso"] { background: var(--type-curso-bg); color: var(--type-curso); }
  .event-pill[data-type="reuniao"] { background: var(--type-reuniao-bg); color: var(--type-reuniao); }
  .event-pill[data-type="data_importante"] { background: var(--type-importante-bg); color: var(--type-importante); }
  .event-pill[data-type="ponto"] { background: var(--type-ponto-bg); color: var(--type-ponto); }

  .more-link {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--accent);
    text-align: left;
  }

  /* ---------- List view ---------- */
  .list-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    overflow-x: auto;
  }

  table.event-table {
    width: 100%;
    border-collapse: collapse;
    min-width: 640px;
  }
  .event-table th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-alt);
    position: sticky;
    top: 0;
  }
  .event-table td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    vertical-align: top;
  }
  .event-table tr:last-child td { border-bottom: none; }
  .event-table td.date-cell { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text-muted); }

  .type-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    white-space: nowrap;
  }
  .type-badge[data-type="ferias"] { background: var(--type-ferias-bg); color: var(--type-ferias); }
  .type-badge[data-type="curso"] { background: var(--type-curso-bg); color: var(--type-curso); }
  .type-badge[data-type="reuniao"] { background: var(--type-reuniao-bg); color: var(--type-reuniao); }
  .type-badge[data-type="data_importante"] { background: var(--type-importante-bg); color: var(--type-importante); }
  .type-badge[data-type="ponto"] { background: var(--type-ponto-bg); color: var(--type-ponto); }

  .empty-state {
    padding: 48px 20px;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ---------- Team directory ---------- */
  .directory {
    margin-top: 22px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
  }

  .directory > summary {
    padding: 14px 16px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .directory > summary::-webkit-details-marker { display: none; }
  .directory > summary::after {
    content: "▾";
    color: var(--text-faint);
    transition: transform 0.15s ease;
  }
  .directory[open] > summary::after { transform: rotate(180deg); }

  .directory-body {
    padding: 0 16px 16px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 14px;
  }

  .squad-card {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
  }
  .squad-card h3 {
    margin: 0 0 8px;
    font-size: 13.5px;
    font-weight: 700;
  }
  .squad-card ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .squad-card li { font-size: 12.5px; }
  .squad-card .name { font-weight: 600; }
  .squad-card .role { color: var(--text-muted); display: block; font-size: 11.5px; }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 18, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 40;
  }
  .modal-overlay[hidden] { display: none; }

  .modal {
    background: var(--surface);
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 18px;
    box-shadow: var(--shadow);
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .modal-header h2 {
    font-size: 15px;
    margin: 0;
    text-transform: capitalize;
  }
  .modal-close {
    border: none;
    background: var(--surface-alt);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
  }
  .modal-event {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .modal-event:last-child { border-bottom: none; }
  .modal-event-title { font-weight: 700; font-size: 13.5px; margin-bottom: 3px; }
  .modal-event-meta { font-size: 12px; color: var(--text-muted); }
  .modal-event-desc { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }
</style>

<div class="app">
  <header class="header">
    <div>
      <h1>Cronograma de Responsabilidades</h1>
      <p class="subtitle">Consulte squads, analistas, férias, cursos, reuniões extraordinárias e datas importantes.</p>
    </div>
    <div class="source-note" id="sourceNote">
      <span class="source-dot" id="sourceDot"></span>
      <span id="sourceText">Carregando dados…</span>
    </div>
  </header>

  <div class="layout">
    <aside class="filters" aria-label="Filtros">
      <div class="filter-group">
        <label class="filter-label" for="searchInput">Buscar</label>
        <input type="search" id="searchInput" placeholder="Título, analista, squad…" autocomplete="off" />
      </div>

      <div class="filter-group">
        <label class="filter-label" for="squadSelect">Squad</label>
        <select id="squadSelect">
          <option value="">Todas as squads</option>
        </select>
      </div>

      <div class="filter-group">
        <label class="filter-label" for="analistaSelect">Analista responsável</label>
        <select id="analistaSelect">
          <option value="">Todos os analistas</option>
        </select>
      </div>

      <div class="filter-group">
        <span class="filter-label">Tipo</span>
        <div class="type-chips" id="typeChips" role="group" aria-label="Filtrar por tipo"></div>
      </div>

      <button class="clear-btn" id="clearFilters" type="button">Limpar filtros</button>

      <div class="filter-summary" id="filterSummary"></div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div class="month-nav">
          <button class="nav-btn" id="prevMonth" type="button" aria-label="Mês anterior">‹</button>
          <span class="month-label" id="monthLabel"></span>
          <button class="nav-btn" id="nextMonth" type="button" aria-label="Próximo mês">›</button>
          <button class="today-btn" id="todayBtn" type="button">Hoje</button>
        </div>
        <div class="view-toggle" role="group" aria-label="Alternar visualização">
          <button id="viewMonthBtn" type="button" aria-pressed="true">Mês</button>
          <button id="viewListBtn" type="button" aria-pressed="false">Lista</button>
        </div>
      </div>

      <div id="monthView">
        <div class="calendar">
          <div class="weekday-row">
            <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
          </div>
          <div class="weeks" id="weeksContainer"></div>
        </div>
      </div>

      <div id="listView" style="display:none;">
        <div class="list-wrap">
          <table class="event-table">
            <thead>
              <tr>
                <th>Data</th>
                <th>Tipo</th>
                <th>Título</th>
                <th>Squad</th>
                <th>Analista</th>
              </tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
          <div class="empty-state" id="listEmpty" hidden>Nenhum evento encontrado para os filtros selecionados.</div>
        </div>
      </div>

      <details class="directory">
        <summary>Equipe: squads, analistas e funções</summary>
        <div class="directory-body" id="directoryBody"></div>
      </details>
    </main>
  </div>
</div>

<div class="modal-overlay" id="dayModalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button class="modal-close" id="modalClose" type="button" aria-label="Fechar">✕</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var TYPE_LABELS = {
    ferias: "Férias",
    curso: "Curso Agendado",
    reuniao: "Reunião Extraordinária",
    data_importante: "Data Importante",
    ponto: "Responsabilidade de Ponto"
  };
  var TYPE_ORDER = ["ferias", "curso", "reuniao", "data_importante", "ponto"];
  var WEEKDAY_LABELS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
  var MONTH_LABELS = [
    "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
    "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
  ];

  var SAMPLE_DATA = {
    squads: [
      { id: "sq-alpha", nome: "Squad Alpha" },
      { id: "sq-beta", nome: "Squad Beta" },
      { id: "sq-gamma", nome: "Squad Gamma" }
    ],
    analistas: [
      { id: "an-01", nome: "Camila Duarte", squadId: "sq-alpha", funcao: "Analista de Roteiros Pleno" },
      { id: "an-02", nome: "Rafael Nogueira", squadId: "sq-alpha", funcao: "Analista de Roteiros Júnior" },
      { id: "an-03", nome: "Beatriz Lima", squadId: "sq-alpha", funcao: "Coordenadora de Squad" },
      { id: "an-04", nome: "Thiago Almeida", squadId: "sq-beta", funcao: "Analista de Roteiros Sênior" },
      { id: "an-05", nome: "Juliana Ferraz", squadId: "sq-beta", funcao: "Analista de Roteiros Pleno" },
      { id: "an-06", nome: "Marcos Vinícius", squadId: "sq-beta", funcao: "Coordenador de Squad" },
      { id: "an-07", nome: "Larissa Prado", squadId: "sq-gamma", funcao: "Analista de Roteiros Pleno" },
      { id: "an-08", nome: "Eduardo Santos", squadId: "sq-gamma", funcao: "Analista de Roteiros Júnior" },
      { id: "an-09", nome: "Fernanda Costa", squadId: "sq-gamma", funcao: "Coordenadora de Squad" }
    ],
    eventos: [
      { id: "ev-001", tipo: "ferias", titulo: "Férias", analistaId: "an-01", dataInicio: "2026-01-12", dataFim: "2026-01-26", descricao: "Férias regulamentares" },
      { id: "ev-002", tipo: "ferias", titulo: "Férias", analistaId: "an-05", dataInicio: "2026-02-02", dataFim: "2026-02-16", descricao: "" },
      { id: "ev-003", tipo: "ferias", titulo: "Férias", analistaId: "an-08", dataInicio: "2026-07-06", dataFim: "2026-07-20", descricao: "" },
      { id: "ev-004", tipo: "ferias", titulo: "Férias", analistaId: "an-03", dataInicio: "2026-12-14", dataFim: "2026-12-28", descricao: "" },
      { id: "ev-005", tipo: "curso", titulo: "Curso: Storytelling Avançado", analistaId: "an-02", dataInicio: "2026-03-10", dataFim: "2026-03-10", descricao: "Turma online, período da tarde" },
      { id: "ev-006", tipo: "curso", titulo: "Curso: Gestão de Prazos Editoriais", analistaId: "an-06", dataInicio: "2026-03-18", dataFim: "2026-03-19", descricao: "Presencial - Auditório 2" },
      { id: "ev-007", tipo: "curso", titulo: "Curso: Liderança para Coordenadores", analistaId: "an-09", dataInicio: "2026-05-05", dataFim: "2026-05-07", descricao: "" },
      { id: "ev-008", tipo: "curso", titulo: "Curso: Ferramentas de Roteiro", analistaId: "an-07", dataInicio: "2026-08-19", dataFim: "2026-08-19", descricao: "" },
      { id: "ev-009", tipo: "reuniao", titulo: "Reunião Extraordinária: Revisão de Escopo", squadId: "sq-alpha", analistaId: "an-03", dataInicio: "2026-02-11", dataFim: "2026-02-11", descricao: "Convocada pela coordenação para alinhar mudanças de escopo do trimestre" },
      { id: "ev-010", tipo: "reuniao", titulo: "Reunião Extraordinária: Alinhamento com Cliente", squadId: "sq-beta", analistaId: "an-06", dataInicio: "2026-04-22", dataFim: "2026-04-22", descricao: "" },
      { id: "ev-011", tipo: "reuniao", titulo: "Reunião Extraordinária: Incidente de Produção", squadId: "sq-gamma", analistaId: "an-09", dataInicio: "2026-06-09", dataFim: "2026-06-09", descricao: "Convocação fora da agenda padrão" },
      { id: "ev-012", tipo: "reuniao", titulo: "Reunião Extraordinária: Revisão Orçamentária", squadId: "sq-alpha", analistaId: "an-03", dataInicio: "2026-09-15", dataFim: "2026-09-15", descricao: "" },
      { id: "ev-013", tipo: "data_importante", titulo: "Entrega Trimestral Q1", squadId: "sq-alpha", dataInicio: "2026-03-31", dataFim: "2026-03-31", descricao: "Fechamento e entrega dos roteiros do primeiro trimestre" },
      { id: "ev-014", tipo: "data_importante", titulo: "Auditoria Interna de Processos", dataInicio: "2026-05-20", dataFim: "2026-05-21", descricao: "Todas as squads" },
      { id: "ev-015", tipo: "data_importante", titulo: "Entrega Trimestral Q2", squadId: "sq-beta", dataInicio: "2026-06-30", dataFim: "2026-06-30", descricao: "" },
      { id: "ev-016", tipo: "data_importante", titulo: "Kickoff Planejamento Anual", dataInicio: "2026-11-03", dataFim: "2026-11-03", descricao: "Todas as squads" },
      { id: "ev-017", tipo: "ponto", titulo: "Responsável pelo Ponto", analistaId: "an-02", squadId: "sq-alpha", dataInicio: "2026-01-01", dataFim: "2026-01-31", descricao: "Registro e validação de ponto da squad" },
      { id: "ev-018", tipo: "ponto", titulo: "Responsável pelo Ponto", analistaId: "an-05", squadId: "sq-beta", dataInicio: "2026-01-01", dataFim: "2026-02-28", descricao: "" },
      { id: "ev-019", tipo: "ponto", titulo: "Responsável pelo Ponto", analistaId: "an-08", squadId: "sq-gamma", dataInicio: "2026-01-01", dataFim: "2026-03-31", descricao: "" },
      { id: "ev-020", tipo: "ponto", titulo: "Responsável pelo Ponto", analistaId: "an-01", squadId: "sq-alpha", dataInicio: "2026-02-01", dataFim: "2026-03-31", descricao: "" }
    ]
  };

  var state = {
    data: null,
    squadsById: {},
    analistasById: {},
    viewYear: 2026,
    viewMonth: 0,
    view: "month",
    filters: { search: "", squadId: "", analistaId: "", types: TYPE_ORDER.slice() }
  };

  function parseISODate(str) {
    var parts = str.split("-");
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  }
  function toISODate(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }
  function formatDateLabel(d) {
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
  }
  function formatRangeLabel(startStr, endStr) {
    if (startStr === endStr) return formatDateLabel(parseISODate(startStr));
    return formatDateLabel(parseISODate(startStr)) + " – " + formatDateLabel(parseISODate(endStr));
  }

  function indexData(data) {
    state.squadsById = {};
    data.squads.forEach(function (s) { state.squadsById[s.id] = s; });
    state.analistasById = {};
    data.analistas.forEach(function (a) { state.analistasById[a.id] = a; });
  }

  function squadNome(id) { return id && state.squadsById[id] ? state.squadsById[id].nome : ""; }
  function analistaNome(id) { return id && state.analistasById[id] ? state.analistasById[id].nome : ""; }
  function eventSquadId(ev) {
    if (ev.squadId) return ev.squadId;
    if (ev.analistaId && state.analistasById[ev.analistaId]) return state.analistasById[ev.analistaId].squadId;
    return "";
  }

  function populateSelects() {
    var squadSelect = document.getElementById("squadSelect");
    state.data.squads.forEach(function (s) {
      var opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = s.nome;
      squadSelect.appendChild(opt);
    });
    refreshAnalistaOptions();
  }

  function refreshAnalistaOptions() {
    var analistaSelect = document.getElementById("analistaSelect");
    var currentValue = state.filters.analistaId;
    analistaSelect.innerHTML = '<option value="">Todos os analistas</option>';
    var list = state.data.analistas.filter(function (a) {
      return !state.filters.squadId || a.squadId === state.filters.squadId;
    });
    list.forEach(function (a) {
      var opt = document.createElement("option");
      opt.value = a.id;
      opt.textContent = a.nome;
      analistaSelect.appendChild(opt);
    });
    var stillValid = list.some(function (a) { return a.id === currentValue; });
    analistaSelect.value = stillValid ? currentValue : "";
    if (!stillValid) state.filters.analistaId = "";
  }

  function buildTypeChips() {
    var container = document.getElementById("typeChips");
    container.innerHTML = "";
    TYPE_ORDER.forEach(function (type) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.dataset.type = type;
      chip.setAttribute("aria-pressed", "true");
      var swatch = document.createElement("span");
      swatch.className = "swatch";
      swatch.style.background = "var(--type-" + type.replace("_importante", "-importante") + ")";
      chip.appendChild(swatch);
      chip.appendChild(document.createTextNode(TYPE_LABELS[type]));
      chip.addEventListener("click", function () {
        var pressed = chip.getAttribute("aria-pressed") === "true";
        chip.setAttribute("aria-pressed", String(!pressed));
        var idx = state.filters.types.indexOf(type);
        if (pressed && idx > -1) state.filters.types.splice(idx, 1);
        else if (!pressed && idx === -1) state.filters.types.push(type);
        render();
      });
      container.appendChild(chip);
    });
  }

  function getFilteredEvents() {
    var f = state.filters;
    var q = f.search.trim().toLowerCase();
    return state.data.eventos.filter(function (ev) {
      if (f.types.indexOf(ev.tipo) === -1) return false;
      var evSquadId = eventSquadId(ev);
      if (f.squadId && evSquadId !== f.squadId) return false;
      if (f.analistaId && ev.analistaId !== f.analistaId) return false;
      if (q) {
        var haystack = [
          ev.titulo,
          ev.descricao || "",
          analistaNome(ev.analistaId),
          squadNome(evSquadId),
          TYPE_LABELS[ev.tipo]
        ].join(" ").toLowerCase();
        if (haystack.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function eventsOnDay(events, day) {
    return events.filter(function (ev) {
      var start = parseISODate(ev.dataInicio);
      var end = parseISODate(ev.dataFim);
      return day >= start && day <= end;
    });
  }

  function renderMonthLabel() {
    document.getElementById("monthLabel").textContent = MONTH_LABELS[state.viewMonth] + " de " + state.viewYear;
  }

  function renderCalendar(filteredEvents) {
    var weeks = document.getElementById("weeksContainer");
    weeks.innerHTML = "";
    var firstOfMonth = new Date(state.viewYear, state.viewMonth, 1);
    var startOffset = firstOfMonth.getDay();
    var gridStart = new Date(state.viewYear, state.viewMonth, 1 - startOffset);
    var today = new Date();

    for (var w = 0; w < 6; w++) {
      var weekRow = document.createElement("div");
      weekRow.className = "week-row";
      var hasVisibleDay = false;
      for (var d = 0; d < 7; d++) {
        var cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + w * 7 + d);
        if (cellDate.getMonth() === state.viewMonth) hasVisibleDay = true;
        weekRow.appendChild(buildDayCell(cellDate, filteredEvents, today));
      }
      if (hasVisibleDay || w < 4) weeks.appendChild(weekRow);
    }
  }

  function buildDayCell(cellDate, filteredEvents, today) {
    var cell = document.createElement("button");
    cell.type = "button";
    cell.className = "day-cell";
    var outside = cellDate.getMonth() !== state.viewMonth;
    if (outside) cell.classList.add("outside");
    if (isSameDay(cellDate, today)) cell.classList.add("is-today");

    var num = document.createElement("span");
    num.className = "day-num";
    num.textContent = cellDate.getDate();
    cell.appendChild(num);

    var dayEvents = eventsOnDay(filteredEvents, cellDate);
    var eventsWrap = document.createElement("div");
    eventsWrap.className = "day-events";
    var maxShow = 3;
    dayEvents.slice(0, maxShow).forEach(function (ev) {
      var pill = document.createElement("div");
      pill.className = "event-pill";
      pill.dataset.type = ev.tipo;
      pill.textContent = ev.titulo;
      eventsWrap.appendChild(pill);
    });
    if (dayEvents.length > maxShow) {
      var more = document.createElement("div");
      more.className = "more-link";
      more.textContent = "+" + (dayEvents.length - maxShow) + " mais";
      eventsWrap.appendChild(more);
    }
    cell.appendChild(eventsWrap);

    cell.addEventListener("click", function () {
      openDayModal(cellDate, dayEvents);
    });
    return cell;
  }

  function openDayModal(day, dayEvents) {
    var overlay = document.getElementById("dayModalOverlay");
    var title = document.getElementById("modalTitle");
    var body = document.getElementById("modalBody");
    title.textContent = formatDateLabel(day) + " — " + WEEKDAY_LABELS[day.getDay()];
    body.innerHTML = "";
    if (dayEvents.length === 0) {
      var empty = document.createElement("p");
      empty.className = "modal-event-meta";
      empty.textContent = "Nenhum evento neste dia para os filtros atuais.";
      body.appendChild(empty);
    } else {
      dayEvents.forEach(function (ev) {
        var row = document.createElement("div");
        row.className = "modal-event";
        var titleEl = document.createElement("div");
        titleEl.className = "modal-event-title";
        titleEl.textContent = ev.titulo;
        var badge = document.createElement("span");
        badge.className = "type-badge";
        badge.dataset.type = ev.tipo;
        badge.textContent = TYPE_LABELS[ev.tipo];
        badge.style.marginLeft = "8px";
        titleEl.appendChild(badge);
        var meta = document.createElement("div");
        meta.className = "modal-event-meta";
        var metaParts = [];
        var sId = eventSquadId(ev);
        if (sId) metaParts.push(squadNome(sId));
        if (ev.analistaId) metaParts.push(analistaNome(ev.analistaId));
        metaParts.push(formatRangeLabel(ev.dataInicio, ev.dataFim));
        meta.textContent = metaParts.join(" · ");
        row.appendChild(titleEl);
        row.appendChild(meta);
        if (ev.descricao) {
          var desc = document.createElement("div");
          desc.className = "modal-event-desc";
          desc.textContent = ev.descricao;
          row.appendChild(desc);
        }
        body.appendChild(row);
      });
    }
    overlay.hidden = false;
  }

  function closeDayModal() {
    document.getElementById("dayModalOverlay").hidden = true;
  }

  function renderList(filteredEvents) {
    var body = document.getElementById("listBody");
    var emptyState = document.getElementById("listEmpty");
    body.innerHTML = "";
    var sorted = filteredEvents.slice().sort(function (a, b) {
      return a.dataInicio.localeCompare(b.dataInicio);
    });
    if (sorted.length === 0) {
      emptyState.hidden = false;
      return;
    }
    emptyState.hidden = true;
    sorted.forEach(function (ev) {
      var tr = document.createElement("tr");

      var dateCell = document.createElement("td");
      dateCell.className = "date-cell";
      dateCell.textContent = formatRangeLabel(ev.dataInicio, ev.dataFim);
      tr.appendChild(dateCell);

      var typeCell = document.createElement("td");
      var badge = document.createElement("span");
      badge.className = "type-badge";
      badge.dataset.type = ev.tipo;
      badge.textContent = TYPE_LABELS[ev.tipo];
      typeCell.appendChild(badge);
      tr.appendChild(typeCell);

      var titleCell = document.createElement("td");
      titleCell.textContent = ev.titulo;
      tr.appendChild(titleCell);

      var squadCell = document.createElement("td");
      squadCell.textContent = squadNome(eventSquadId(ev)) || "—";
      tr.appendChild(squadCell);

      var analistaCell = document.createElement("td");
      analistaCell.textContent = analistaNome(ev.analistaId) || "—";
      tr.appendChild(analistaCell);

      body.appendChild(tr);
    });
  }

  function renderDirectory() {
    var container = document.getElementById("directoryBody");
    container.innerHTML = "";
    state.data.squads.forEach(function (squad) {
      var card = document.createElement("div");
      card.className = "squad-card";
      var h3 = document.createElement("h3");
      h3.textContent = squad.nome;
      card.appendChild(h3);
      var ul = document.createElement("ul");
      state.data.analistas
        .filter(function (a) { return a.squadId === squad.id; })
        .forEach(function (a) {
          var li = document.createElement("li");
          var nameSpan = document.createElement("span");
          nameSpan.className = "name";
          nameSpan.textContent = a.nome;
          var roleSpan = document.createElement("span");
          roleSpan.className = "role";
          roleSpan.textContent = a.funcao;
          li.appendChild(nameSpan);
          li.appendChild(roleSpan);
          ul.appendChild(li);
        });
      card.appendChild(ul);
      container.appendChild(card);
    });
  }

  function renderSummary(filteredEvents) {
    var el = document.getElementById("filterSummary");
    el.innerHTML = "<strong>" + filteredEvents.length + "</strong> evento(s) encontrados";
  }

  function render() {
    var filteredEvents = getFilteredEvents();
    renderMonthLabel();
    if (state.view === "month") {
      renderCalendar(filteredEvents);
    } else {
      renderList(filteredEvents);
    }
    renderSummary(filteredEvents);
  }

  function setView(view) {
    state.view = view;
    document.getElementById("monthView").style.display = view === "month" ? "" : "none";
    document.getElementById("listView").style.display = view === "list" ? "" : "none";
    document.getElementById("viewMonthBtn").setAttribute("aria-pressed", String(view === "month"));
    document.getElementById("viewListBtn").setAttribute("aria-pressed", String(view === "list"));
    render();
  }

  function wireControls() {
    document.getElementById("searchInput").addEventListener("input", function (e) {
      state.filters.search = e.target.value;
      render();
    });
    document.getElementById("squadSelect").addEventListener("change", function (e) {
      state.filters.squadId = e.target.value;
      refreshAnalistaOptions();
      render();
    });
    document.getElementById("analistaSelect").addEventListener("change", function (e) {
      state.filters.analistaId = e.target.value;
      render();
    });
    document.getElementById("clearFilters").addEventListener("click", function () {
      state.filters = { search: "", squadId: "", analistaId: "", types: TYPE_ORDER.slice() };
      document.getElementById("searchInput").value = "";
      document.getElementById("squadSelect").value = "";
      refreshAnalistaOptions();
      Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (chip) {
        chip.setAttribute("aria-pressed", "true");
      });
      render();
    });
    document.getElementById("prevMonth").addEventListener("click", function () {
      state.viewMonth -= 1;
      if (state.viewMonth < 0) { state.viewMonth = 11; state.viewYear -= 1; }
      render();
    });
    document.getElementById("nextMonth").addEventListener("click", function () {
      state.viewMonth += 1;
      if (state.viewMonth > 11) { state.viewMonth = 0; state.viewYear += 1; }
      render();
    });
    document.getElementById("todayBtn").addEventListener("click", function () {
      var now = new Date();
      state.viewYear = now.getFullYear();
      state.viewMonth = now.getMonth();
      render();
    });
    document.getElementById("viewMonthBtn").addEventListener("click", function () { setView("month"); });
    document.getElementById("viewListBtn").addEventListener("click", function () { setView("list"); });
    document.getElementById("modalClose").addEventListener("click", closeDayModal);
    document.getElementById("dayModalOverlay").addEventListener("click", function (e) {
      if (e.target === this) closeDayModal();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeDayModal();
    });
  }

  function setSource(ok) {
    var dot = document.getElementById("sourceDot");
    var text = document.getElementById("sourceText");
    if (ok) {
      dot.classList.remove("fallback");
      text.textContent = "Dados carregados de data.json";
    } else {
      dot.classList.add("fallback");
      text.textContent = "Exibindo dados de exemplo (data.json não encontrado)";
    }
  }

  function boot(data, loadedFromFile) {
    state.data = data;
    indexData(data);
    populateSelects();
    buildTypeChips();
    renderDirectory();
    wireControls();
    setSource(loadedFromFile);
    render();
  }

  fetch("./data.json")
    .then(function (res) {
      if (!res.ok) throw new Error("not ok");
      return res.json();
    })
    .then(function (data) { boot(data, true); })
    .catch(function () { boot(SAMPLE_DATA, false); });
})();
</script>
